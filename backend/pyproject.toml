[project]
name = "lawinc-api"
version = "0.1.0"
requires-python = ">=3.14.6"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.12.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
